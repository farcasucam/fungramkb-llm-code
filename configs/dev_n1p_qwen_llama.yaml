# Parser development (7 Oct 2026): N1P on the DEV split only, Qwen (port 8000) and Llama (port 8001).
# Start them on the Spark with: docker start fgkb-qwen fgkb-llama   (stop fgkb-olmo first to free memory)
kb: data/processed/fungramkb.json
benchmark: data/processed/fgkb_reason.jsonl
splits: [dev]
contrast_over: [test_seen, test_unseen, dev]   # same dev items as the pilot analysis set
tasks: [deep]
subset: contrast
budget_tokens: 1500
conditions: [N1P]
constrained_decoding: true
batch_size: 128
models:
  - {name: qwen2.5-7b-instruct-bf16, kind: openai, model: "Qwen/Qwen2.5-7B-Instruct", base_url: "http://192.168.1.112:8000/v1", concurrency: 64, grammar_field: json_schema}
  - {name: llama3.1-8b-instruct-bf16, kind: openai, model: "meta-llama/Llama-3.1-8B-Instruct", base_url: "http://192.168.1.112:8001/v1", concurrency: 64, grammar_field: json_schema}
gen: {max_tokens: 1024, temperature: 0.0, seed: 0}
output: results/dev_n1p.jsonl

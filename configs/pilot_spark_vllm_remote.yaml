# Go/no-go pilot from the PC against two `vllm serve` instances on the DGX Spark (bf16 weights).
# Start them on the Spark with scripts/spark_vllm_up.sh (ports 8000 and 8001).
# N1 is constrained with a JSON schema (response_format), the same mechanism as with Ollama, so the
# constraint is identical across servers; the query is converted back to COREL.
kb: data/processed/fungramkb.json
benchmark: data/processed/fgkb_reason.jsonl
splits: [test_seen, test_unseen, dev]
tasks: [deep]
subset: contrast
budget_tokens: 1500
conditions: [B1, G1, G2, G4, R1, N1]
constrained_decoding: true
n2_retries: 2
batch_size: 128
models:
  - {name: qwen2.5-7b-instruct-bf16, kind: openai, model: "Qwen/Qwen2.5-7B-Instruct", base_url: "http://192.168.1.112:8000/v1", concurrency: 64, grammar_field: json_schema}
  - {name: llama3.1-8b-instruct-bf16, kind: openai, model: "meta-llama/Llama-3.1-8B-Instruct", base_url: "http://192.168.1.112:8001/v1", concurrency: 64, grammar_field: json_schema}
gen: {max_tokens: 384, temperature: 0.0, seed: 0}
output: results/pilot_spark_vllm.jsonl

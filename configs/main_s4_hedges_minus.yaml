# S4 (analysis plan, section 8, as amended): G2 minus one component, Qwen only. Model names get the suffix @<ablation>.
# +postulates: no thematic frames or Cognicon; -hedges: no always/typically; -fillers: no expansion along role edges.
kb: data/processed/fungramkb.json
benchmark: data/processed/fgkb_reason_main.jsonl
splits:
- test_seen
- test_unseen
contrast_over:
- test_seen
- test_unseen
- dev
tasks:
- deep
subset: contrast
budget_tokens: 1500
conditions:
- G2
constrained_decoding: true
batch_size: 128
models:
- name: qwen2.5-7b-instruct-bf16
  kind: openai
  model: Qwen/Qwen2.5-7B-Instruct
  base_url: http://192.168.1.112:8000/v1
  concurrency: 64
  grammar_field: json_schema
gen:
  max_tokens: 1024
  temperature: 0.0
  seed: 0
output: results/main_s4.jsonl
ablation: -hedges
